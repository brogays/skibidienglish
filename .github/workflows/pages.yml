name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website files
        env:
          LINGUA_API_BASE_URL: ${{ vars.LINGUA_API_BASE_URL }}
        run: |
          mkdir _site
          cp *.html *.css *.js _site/
          node -e "require('fs').writeFileSync('_site/api-config.js', 'window.LINGUA_API_BASE_URL = ' + JSON.stringify(process.env.LINGUA_API_BASE_URL || '') + ';\\n')"
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
